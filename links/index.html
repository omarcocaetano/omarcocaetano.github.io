<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marco Antonio · Links</title>
<meta name="description" content="Marco Antonio (@omarcocaetano): marketing, tráfego pago e atendimento para negócios locais de Araguaína.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: cartão único centralizado no celular, lista de botões grandes, verde-limão só no que é ação principal */
  --bg: #0A0C0A;
  --card: #161A16;
  --line: #2a312a;
  --text: #F6F8F0;
  --muted: #a7ae9f;
  --lime: #D6FF1F;
  --on-lime: #0A0C0A;
  --display: "Anton", "Arial Narrow", Impact, sans-serif;
  --body: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; border-radius: 6px; }
main { max-width: 460px; margin: 0 auto; padding: 44px 20px 40px; display: grid; gap: 28px; }

.head { display: grid; justify-items: center; text-align: center; gap: 12px; }
.badge { width: 84px; height: 84px; border-radius: 22px; background: var(--lime); color: var(--on-lime); display: grid; place-items: center; font-family: var(--display); font-size: 2.8rem; }
.head h1 { margin: 4px 0 0; font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: 2.2rem; line-height: 1; letter-spacing: .01em; }
.handle { color: var(--lime); font-weight: 600; font-size: .9rem; text-decoration: none; }
.head p { margin: 0; color: var(--muted); font-size: .95rem; max-width: 30em; text-wrap: balance; }
.place { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }

.links { display: grid; gap: 12px; }
.link {
  display: grid; grid-template-columns: 44px 1fr 20px; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 16px; text-decoration: none;
  background: var(--card); border: 1px solid var(--line); color: var(--text);
  transition: border-color .15s, transform .15s;
}
.link:hover { border-color: var(--lime); transform: translateY(-2px); }
.link .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #0f120f; border: 1px solid var(--line); }
.link .ic svg { width: 22px; height: 22px; fill: currentColor; }
.link b { display: block; font-weight: 700; font-size: 1rem; }
.link small { display: block; color: var(--muted); font-size: .8rem; }
.link .arrow { color: var(--muted); font-size: 1.1rem; }
.link.main { background: var(--lime); color: var(--on-lime); border-color: var(--lime); }
.link.main small, .link.main .arrow { color: #2b3300; }
.link.main .ic { background: var(--on-lime); color: var(--lime); border-color: var(--on-lime); }

.section-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--muted); margin: 0 0 -4px; }

footer { text-align: center; font-size: .78rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .link { transition: none; } .link:hover { transform: none; } }
</style>
</head>
<body>
<main>
  <header class="head">
    <div class="badge" aria-hidden="true">M</div>
    <h1>Marco Antonio</h1>
    <a class="handle" href="https://www.instagram.com/omarcocaetano/" target="_blank" rel="noopener">@omarcocaetano</a>
    <p>Simplifico estratégias de marketing para você aplicar no seu negócio. Tráfego pago, conteúdo e atendimento que vende.</p>
    <span class="place">Araguaína · TO</span>
  </header>

  <nav class="links" id="links" aria-label="Meus canais"></nav>

  <footer>Marco Antonio · @omarcocaetano</footer>
</main>

<script>
/* =========================================================
   CANAIS: para ativar um canal, preencha o "url".
   Canal com url vazio não aparece na página.
   ========================================================= */
const CANAIS = [
  { id: "whatsapp",  nome: "Fale comigo no WhatsApp", sub: "Quero ajuda com o meu negócio", destaque: true,
    url: "https://wa.me/556391114789?text=" + encodeURIComponent("Oi Marco, vim pelo seu link da bio e quero ajuda com o meu negócio.") },
  { id: "materiais", nome: "Materiais dos vídeos", sub: "Checklists e mensagens prontas",
    url: "https://omarcocaetano.github.io/" },
  { id: "instagram", nome: "Instagram", sub: "@omarcocaetano",
    url: "https://www.instagram.com/omarcocaetano/" },
  { id: "tiktok",    nome: "TikTok",   sub: "@omarcocaetano", url: "https://www.tiktok.com/@omarcocaetano" },
  { id: "youtube",   nome: "YouTube",  sub: "@omarcocaetano", url: "https://www.youtube.com/@omarcocaetano" },
  { id: "linkedin",  nome: "LinkedIn", sub: "Marco Antonio", url: "https://www.linkedin.com/in/omarcocaetano/" }
];

const ICONES = {
  whatsapp: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3Z"/></svg>',
  materiais: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5V3Zm2 2v14h10V8h-3V5H7Zm2 6h6v2H9v-2Zm0 4h6v2H9v-2Z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4ZM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4ZM12 3.8c2.7 0 3 0 4 .1 2.7.1 4 1.4 4.1 4.1.1 1 .1 1.4.1 4s0 3-.1 4c-.1 2.7-1.4 4-4.1 4.1-1 .1-1.4.1-4 .1s-3 0-4-.1c-2.7-.1-4-1.4-4.1-4.1-.1-1-.1-1.4-.1-4s0-3 .1-4C4 5.3 5.3 4 8 3.9c1-.1 1.3-.1 4-.1ZM12 2c-2.7 0-3.1 0-4.1.1C4.3 2.2 2.2 4.3 2.1 7.9 2 8.9 2 9.3 2 12s0 3.1.1 4.1c.1 3.6 2.2 5.7 5.8 5.8 1 .1 1.4.1 4.1.1s3.1 0 4.1-.1c3.6-.1 5.7-2.2 5.8-5.8.1-1 .1-1.4.1-4.1s0-3.1-.1-4.1c-.1-3.6-2.2-5.7-5.8-5.8C15.1 2 14.7 2 12 2Z"/></svg>',
  tiktok:    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 2h-3.3v13.2a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9a6.3 6.3 0 1 0 5.3 6.2V8.6a7.7 7.7 0 0 0 4.4 1.4V6.7a4.4 4.4 0 0 1-4.4-4.7Z"/></svg>',
  youtube:   '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 8.2a3 3 0 0 0-2.1-2.1C18 5.6 12 5.6 12 5.6s-6 0-7.9.5A3 3 0 0 0 2 8.2 31 31 0 0 0 1.6 12 31 31 0 0 0 2 15.8a3 3 0 0 0 2.1 2.1c1.9.5 7.9.5 7.9.5s6 0 7.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .4-3.8 31 31 0 0 0-.4-3.8ZM10 15V9l5.2 3L10 15Z"/></svg>',
  linkedin:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.75h4V21H3V9.75Zm6.5 0h3.8v1.6h.1c.5-1 1.8-2 3.8-2 4 0 4.8 2.6 4.8 6V21h-4v-5c0-1.2 0-2.8-1.7-2.8s-2 1.3-2 2.7V21h-4V9.75Z"/></svg>'
};

document.getElementById("links").innerHTML = CANAIS.filter(c => c.url).map(c => `
  <a class="link${c.destaque ? " main" : ""}" href="${c.url}" target="_blank" rel="noopener">
    <span class="ic">${ICONES[c.id] || ""}</span>
    <span><b>${c.nome}</b>${c.sub ? `<small>${c.sub}</small>` : ""}</span>
    <span class="arrow" aria-hidden="true">→</span>
  </a>`).join("");
</script>
</body>
</html>
