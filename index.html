<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materiais do Marco</title>
<meta name="description" content="Materiais dos vídeos do @omarcocaetano: estratégias de marketing e vendas simplificadas para o dono de negócio local.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: coluna única pensada para o celular, fundo quase preto, verde-limão como assinatura (identidade do Marco) */
  --bg: #0A0C0A;
  --card: #161A16;
  --card-2: #1d221d;
  --line: #2a312a;
  --text: #F6F8F0;
  --muted: #a7ae9f;
  --lime: #D6FF1F;
  --on-lime: #0A0C0A;
  --display: "Anton", "Arial Narrow", Impact, sans-serif;
  --body: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 1rem;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 20px; }
strong { font-weight: 700; }

.mark {
  background: var(--lime); color: var(--on-lime);
  padding: .05em .22em; border-radius: 3px; font-weight: 600;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}

/* Topo */
header.top { border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 16px; padding-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand-badge {
  width: 38px; height: 38px; border-radius: 50%; overflow: hidden; border: 2px solid var(--lime); flex: none;
  background: var(--lime); color: var(--on-lime);
  display: grid; place-items: center;
  font-family: var(--display); font-size: 1.25rem;
}
.brand-badge img { width: 100%; height: 100%; object-fit: cover; display: block; }
.brand-name { font-weight: 700; font-size: .95rem; line-height: 1.2; }
.brand-name small { display: block; font-weight: 400; font-size: .75rem; color: var(--muted); }
.ig-link { font-size: .85rem; font-weight: 600; text-decoration: none; color: var(--lime); }
.ig-link:hover { text-decoration: underline; }

/* Capa da home */
.hero { padding: 48px 0 32px; }
.hero h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(2.5rem, 10vw, 3.8rem); line-height: 1.02;
  margin: 0 0 18px; text-transform: uppercase; text-wrap: balance; letter-spacing: .005em;
}
.hero h1 em { font-style: normal; color: var(--lime); }
.hero p { margin: 0; max-width: 34em; color: var(--muted); font-size: 1.02rem; }

/* Lista de posts */
.list-label { font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; color: var(--muted); margin: 8px 0 14px; }
.posts { display: grid; gap: 14px; padding-bottom: 56px; }
.post-card {
  display: grid; gap: 10px; text-decoration: none;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px;
  transition: border-color .15s, transform .15s;
}
.post-card:hover { border-color: var(--lime); transform: translateY(-2px); }
.post-card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.65rem; line-height: 1.08; text-transform: uppercase; text-wrap: balance; }
.post-card p { margin: 0; color: var(--muted); font-size: .95rem; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); }
.chip { font-weight: 700; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: 99px; background: var(--lime); color: var(--on-lime); }
.chip.soft { background: transparent; color: var(--text); border: 1px solid var(--line); }

/* Artigo */
.back { display: inline-block; margin: 24px 0 0; font-size: .85rem; font-weight: 600; text-decoration: none; color: var(--muted); }
.back:hover { color: var(--lime); }
article { padding: 22px 0 40px; }
article h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(2.3rem, 9vw, 3.4rem); line-height: 1.03; text-transform: uppercase;
  margin: 16px 0 14px; text-wrap: balance; letter-spacing: .005em;
}
.byline { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); margin: 0 0 26px; }
.byline b { color: var(--text); font-weight: 600; }
.byline a { color: var(--lime); text-decoration: none; }
.lead { font-size: 1.12rem; line-height: 1.6; margin: 0 0 14px; }
article h2 {
  font-family: var(--display); font-weight: 400; text-transform: uppercase;
  font-size: 1.7rem; line-height: 1.08; margin: 44px 0 12px; text-wrap: balance; letter-spacing: .01em;
}
article h2 .n { color: var(--lime); }
article p { margin: 0 0 16px; }
article ul, article ol { margin: 0 0 18px; padding-left: 1.2em; display: grid; gap: 8px; }
article li::marker { color: var(--lime); }
.src { font-size: .78rem; color: var(--muted); margin-top: -6px; }
.quote {
  margin: 36px 0; padding: 24px; border-radius: 16px;
  background: var(--card); border: 1px solid var(--lime);
  font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: 1.8rem; line-height: 1.1; text-wrap: balance;
}
.quote span { color: var(--lime); }

/* Checklist interativo */
.checklist { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 10px; }
.checklist label {
  display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
}
.checklist input { appearance: none; -webkit-appearance: none; margin: 3px 0 0; width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 6px; display: grid; place-items: center; cursor: pointer; background: transparent; }
.checklist input:checked { background: var(--lime); border-color: var(--lime); }
.checklist input:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--on-lime); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px,-1px); }
.checklist strong { display: block; }
.checklist .hint { color: var(--muted); font-size: .9rem; }
.score { font-size: .92rem; font-weight: 600; margin: 0 0 18px; font-variant-numeric: tabular-nums; }
.score b { background: var(--lime); color: var(--on-lime); padding: 0 6px; border-radius: 4px; }

.script-box { background: var(--card); border: 1px dashed var(--muted); border-radius: 12px; padding: 16px 18px; margin: 0 0 18px; }
.script-box .lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--lime); }
.script-box p { margin: 4px 0 0; }

/* Cartões de resposta com botão Copiar */
.reply { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 0 0 14px; display: grid; gap: 12px; }
.reply-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.reply-tag { font-weight: 700; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--lime); }
.bubble { background: var(--card-2); border-radius: 4px 14px 14px 14px; padding: 14px 16px; font-size: 1rem; line-height: 1.6; }
.slot { background: rgba(214,255,31,.16); color: var(--lime); border: 1px dashed var(--lime); border-radius: 5px; padding: 0 .3em; font-weight: 600; white-space: nowrap; }
.when { margin: 0; font-size: .88rem; color: var(--muted); }
.when b { color: var(--text); }
.copy-btn {
  font: 700 .8rem var(--body); padding: 8px 14px; border-radius: 99px; cursor: pointer;
  border: 1px solid var(--lime); background: transparent; color: var(--lime); white-space: nowrap;
}
.copy-btn:hover, .copy-btn.ok { background: var(--lime); color: var(--on-lime); }
.reply.filled { border-style: dashed; }

/* Bloco destacado */
.callout { background: var(--card); border-left: 4px solid var(--lime); border-radius: 0 16px 16px 0; padding: 20px 20px 4px; margin: 0 0 18px; }
.callout h2 { margin-top: 0; }

/* Calculadora */
.calc { background: var(--card); border: 1px solid var(--lime); border-radius: 16px; padding: 18px; margin: 0 0 18px; display: grid; gap: 14px; }
.calc-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.calc label { display: grid; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.calc input { font: 700 1.1rem var(--body); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; font-variant-numeric: tabular-nums; }
.calc-out { margin: 0; font-size: .98rem; font-variant-numeric: tabular-nums; }

/* Calendário de semanas */
.weeks { display: grid; gap: 14px; margin: 0 0 22px; }
.week { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--lime); border-radius: 0 16px 16px 0; padding: 20px 20px 4px; }
.week h3 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: 1.45rem; line-height: 1.1; margin: 10px 0 8px; }
.week-tag { display: inline-block; font-weight: 700; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: 99px; background: var(--lime); color: var(--on-lime); font-variant-numeric: tabular-nums; }
.week .script-box { background: var(--bg); }

/* CTA final */
.cta { background: var(--card); border: 1px solid var(--line); border-radius: 18px; margin-top: 40px; padding: 24px; display: grid; gap: 14px; }
.cta h3 { margin: 0; font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: 1.7rem; line-height: 1.08; text-wrap: balance; }
.cta p { margin: 0; color: var(--muted); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font: 800 .95rem var(--body); padding: 14px 20px; border-radius: 99px; cursor: pointer; text-decoration: none; text-align: center;
  border: 2px solid var(--lime); background: var(--lime); color: var(--on-lime);
}
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn:hover { transform: translateY(-1px); }
@media (max-width: 420px) { .btn-row .btn { flex: 1 1 100%; } }

footer { border-top: 1px solid var(--line); padding: 26px 0 40px; font-size: .82rem; color: var(--muted); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
footer a { color: var(--lime); text-decoration: none; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .post-card:hover, .btn:hover { transform: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#inicio" aria-label="Página inicial">
      <span class="brand-badge" aria-hidden="true"><img src="foto.jpg" alt=""></span>
      <span class="brand-name">Marco Antonio<small>Marketing e vendas para negócio local</small></span>
    </a>
    <a class="ig-link" href="https://www.instagram.com/omarcocaetano/" target="_blank" rel="noopener">@omarcocaetano</a>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer>
  <div class="wrap">
    <span>Marco Antonio · Araguaína, TO · <a href="https://www.instagram.com/omarcocaetano/" target="_blank" rel="noopener">@omarcocaetano</a></span>
    <span>Viu o vídeo? O material completo fica aqui.</span>
  </div>
</footer>

<script>
/* =========================================================
   POSTS — para publicar um material novo, adicione um objeto
   no início desta lista. O "slug" vira o link: .../#slug
   ========================================================= */
const POSTS = [
  {
    slug: "cupom",
    titulo: "Como montar o cupom do influenciador e saber quanto ele vendeu",
    apoio: "O passo a passo para contratar influenciador pequeno da sua cidade sem pagar no escuro: o cupom com o nome dele, a mensagem pronta e a conta do fim do mês.",
    resumo: "Escolha quem fala com o seu público, combine um cupom com o nome dele, peça o que ele precisa mostrar e, no fim do mês, faça a conta de quanto custou cada venda.",
    data: "2026-11-24",
    pilar: "Tráfego e marketing",
    palavra: "CUPOM",
    ctaTitulo: "Quer ajuda para escolher e medir os influenciadores da sua loja?",
    ctaTexto: "Eu olho os perfis com você, monto a proposta e a planilha do cupom, para você só pagar por quem traz venda.",
    wppMsg: "Oi Marco, vim pelo vídeo do contrata ou não contrata e quero montar o cupom do influenciador na minha loja.",
    corpo: `
      <p class="lead">Influenciador sem cupom é anúncio sem relatório: <span class="mark">você paga e não sabe o que voltou.</span></p>
      <p>Vários influenciadores pequenos da sua cidade costumam dar mais resultado do que um grande de fora, porque o público deles passa na frente da sua loja. O cupom com o nome de cada um mostra, no fim do mês, quem vendeu e quem só deu curtida.</p>

      <h2><span class="n">1.</span> Escolha quem fala com o seu público</h2>
      <ul>
        <li><b>É daqui:</b> a maior parte dos comentários é de gente da sua cidade.</li>
        <li><b>É do seu nicho:</b> fala de moda, de comida, de beleza ou do que você vende, e não de tudo um pouco.</li>
        <li><b>Tem conversa de verdade:</b> abra os Stories dele por uns dias. Gente respondendo e perguntando vale mais que número de seguidor.</li>
      </ul>

      <h2><span class="n">2.</span> Crie o cupom com o nome dele</h2>
      <p>Um cupom por influenciador, fácil de falar: <b>NOME10</b>, por exemplo. O benefício pode ser um brinde, frete grátis ou um desconto pequeno. Desconto grande só ensina o cliente a esperar o próximo cupom.</p>
      <div class="callout">
        <ul>
          <li><b>Vende pelo WhatsApp?</b> O cliente fala o cupom na conversa. Anote numa etiqueta com o nome do influenciador.</li>
          <li><b>Vende na loja física?</b> Deixe um caderno ou planilha no caixa: data, cupom e valor da venda.</li>
          <li><b>Vende pelo site?</b> Crie o cupom na plataforma da loja. Ela já conta as vendas sozinha.</li>
        </ul>
      </div>

      <h2><span class="n">3.</span> Mande a proposta</h2>
      <div class="reply">
        <div class="reply-head"><span class="reply-tag">Primeira mensagem para o influenciador</span><button class="copy-btn" type="button" data-copy="c1">Copiar</button></div>
        <div class="bubble" id="c1">Oi, <span class="slot">[nome]</span>! Aqui é <span class="slot">[seu nome]</span> da <span class="slot">[loja]</span>. Acompanho o seu perfil e o seu público tem tudo a ver com a gente. Quero te propor uma parceria de 30 dias com um cupom com o seu nome. Posso te mandar como funciona?</div>
      </div>
      <div class="reply">
        <div class="reply-head"><span class="reply-tag">Como funciona (depois que ele responder)</span><button class="copy-btn" type="button" data-copy="c2">Copiar</button></div>
        <div class="bubble" id="c2">Funciona assim: você ganha <span class="slot">[valor fixo ou produto]</span> e mais <span class="slot">[X]</span>% de cada venda com o cupom <span class="slot">[NOME10]</span>. Quem usar o cupom ganha <span class="slot">[benefício]</span>. Peço só três coisas: mostrar o produto em uso, falar o preço e dizer como comprar. Topa?</div>
      </div>

      <h2><span class="n">4.</span> Combine o que ele precisa mostrar</h2>
      <ul>
        <li><b>O produto em uso</b>, de verdade, e não só a foto do fornecedor.</li>
        <li><b>O preço</b>, ou pelo menos o "a partir de".</li>
        <li><b>Como comprar:</b> o cupom, o seu @ e o seu WhatsApp.</li>
      </ul>

      <h2><span class="n">5.</span> Faça a conta no fim do mês</h2>
      <p>Some quanto você pagou para o influenciador (cachê, produto e comissão) e divida pelo número de vendas com o cupom dele. Esse é o quanto custou cada venda. Compare com o que você paga no anúncio e fique com quem vende mais barato.</p>
      <div class="callout">
        <p><b>Exemplo:</b> você pagou R$ 300 e o cupom trouxe 10 vendas. Cada venda custou R$ 30. Se o seu anúncio traz venda por R$ 45, esse influenciador está mais barato que o anúncio.</p>
      </div>
    `
  },
  {
    slug: "recompra",
    titulo: "5 estratégias para fazer o cliente voltar",
    apoio: "O cliente que já comprou é o mais barato que existe. Aqui estão as mensagens prontas para ele comprar de novo, sem pagar anúncio outra vez.",
    resumo: "Separe quem já comprou, chame três dias depois, dê a novidade antes de todo mundo, lembre na hora da recompra e peça indicação no momento certo.",
    data: "2026-11-18",
    pilar: "Vendas",
    palavra: "VOLTA",
    ctaTitulo: "Quer montar a rotina de pós-venda da sua loja?",
    ctaTexto: "Eu monto com você a lista de clientes, as mensagens e o calendário de quando chamar cada um, para a venda voltar sem depender de anúncio.",
    wppMsg: "Oi Marco, vim pelo vídeo do cliente mais barato que existe e quero fazer o meu cliente voltar.",
    corpo: `
      <p class="lead">Você paga para trazer o cliente <span class="mark">uma vez só.</span> Depois, é só não esquecer dele.</p>
      <p>Quem já comprou e gostou compra de novo. O problema é que, sem ninguém chamar, ele compra do primeiro que aparecer. Use as estratégias abaixo na ordem e troque o que está destacado pelo dado da sua loja.</p>

      <h2><span class="n">1.</span> Separe quem já comprou</h2>
      <p>No WhatsApp Business, crie a etiqueta <b>CLIENTES</b> e marque cada pessoa que já comprou de você. Comece pelas compras dos últimos três meses. Essa lista vale dinheiro: é para ela que vão todas as mensagens desta página.</p>
      <div class="callout">
        <ul>
          <li><b>Como criar:</b> no WhatsApp Business, toque nos três pontinhos, depois em Etiquetas e em Nova etiqueta.</li>
          <li><b>Como marcar:</b> segure a conversa do cliente e toque no ícone de etiqueta.</li>
          <li><b>Como enviar para todos:</b> use a lista de transmissão só com quem está na etiqueta. Só recebe quem tem o seu número salvo, então peça para salvar na hora da compra.</li>
        </ul>
      </div>

      <h2><span class="n">2.</span> Chame três dias depois da compra</h2>
      <p>Quase ninguém faz isso, e é aí que o cliente lembra de você. Não venda nada nessa mensagem: só pergunte.</p>
      <div class="reply">
        <div class="reply-head"><span class="reply-tag">3 dias depois</span><button class="copy-btn" type="button" data-copy="v1">Copiar</button></div>
        <div class="bubble" id="v1">Oi, <span class="slot">[nome]</span>! Aqui é <span class="slot">[seu nome]</span> da <span class="slot">[loja]</span>. Passando pra saber se chegou tudo certinho com o <span class="slot">[produto]</span> e se você está gostando.</div>
      </div>
      <div class="reply">
        <div class="reply-head"><span class="reply-tag">Se ele respondeu que gostou</span><button class="copy-btn" type="button" data-copy="v2">Copiar</button></div>
        <div class="bubble" id="v2">Que bom! Se puder, me manda uma foto usando. Vou adorar postar nos Stories e te marcar.</div>
      </div>

      <h2><span class="n">3.</span> Dê a novidade antes de todo mundo</h2>
      <p>Chegou produto novo? Mande primeiro para a lista, antes de postar no Instagram. Quem já comprou se sente especial e costuma reservar na hora.</p>
      <div class="reply">
        <div class="reply-head"><span class="reply-tag">Novidade antecipada</span><button class="copy-btn" type="button" data-copy="v3">Copiar</button></div>
        <div class="bubble" id="v3"><span class="slot">[nome]</span>, chegou <span class="slot">[produto novo]</span> e eu separei pra te mostrar antes de postar pra todo mundo. <span class="slot">[R$ preço]</span> ou <span class="slot">[X]</span>x de <span class="slot">[R$ parcela]</span>. Quer que eu guarde um pra você?</div>
      </div>

      <h2><span class="n">4.</span> Lembre na hora da recompra</h2>
      <p>Quase todo produto acaba, gasta ou sai de época. Anote quando o cliente comprou e chame perto da hora de comprar de novo: o perfume que dura dois meses, a ração que acaba em 30 dias, a roupa da próxima estação.</p>
      <div class="reply">
        <div class="reply-head"><span class="reply-tag">Lembrete de recompra</span><button class="copy-btn" type="button" data-copy="v4">Copiar</button></div>
        <div class="bubble" id="v4">Oi, <span class="slot">[nome]</span>! Faz <span class="slot">[tempo]</span> que você levou o <span class="slot">[produto]</span>, deve estar perto de acabar. Quer que eu já separe outro? Entrego <span class="slot">[dia]</span>.</div>
      </div>

      <h2><span class="n">5.</span> Peça indicação no momento certo</h2>
      <p>O melhor momento para pedir indicação é logo depois que o cliente disse que gostou. Dê um motivo para ele indicar.</p>
      <div class="reply">
        <div class="reply-head"><span class="reply-tag">Pedido de indicação</span><button class="copy-btn" type="button" data-copy="v5">Copiar</button></div>
        <div class="bubble" id="v5">Fico muito feliz que você gostou! Se tiver alguém que também ia gostar, me indica: quem vier da sua parte ganha <span class="slot">[benefício]</span>, e você também.</div>
      </div>

      <div class="callout">
        <h2>Regras para não virar spam</h2>
        <ul>

      <p>Pense comigo: o cliente que te chamou já levantou a mão. Ele viu o seu produto, se interessou e tomou a iniciativa. Se ele sai da conversa sem comprar, o dinheiro do anúncio foi embora junto.</p>
      <p>Esse checklist é para você rodar com quem cuida do seu atendimento. Marque o que a sua equipe já faz hoje.</p>

      <h2>O checklist</h2>
      <ul class="checklist" id="chk">
        <li><label><input type="checkbox" id="c1"><span><strong>Responde rápido no horário de pico</strong><span class="hint">Quem chama uma loja costuma chamar outras ao mesmo tempo. Quem responde primeiro sai na frente.</span></span></label></li>
        <li><label><input type="checkbox" id="c2"><span><strong>Chama o cliente pelo nome</strong><span class="hint">Parece detalhe. Na prática, é o que tira a conversa do automático.</span></span></label></li>
        <li><label><input type="checkbox" id="c3"><span><strong>Faz uma pergunta antes de mandar o preço</strong><span class="hint">"É para você ou para presente?", "Qual tamanho você usa?". Quem entende a necessidade vende melhor.</span></span></label></li>
        <li><label><input type="checkbox" id="c4"><span><strong>Manda foto ou vídeo real do produto</strong><span class="hint">Foto da arara, vídeo do produto na mão. Isso passa mais confiança do que a foto de catálogo.</span></span></label></li>
        <li><label><input type="checkbox" id="c5"><span><strong>Conduz para o próximo passo</strong><span class="hint">Toda mensagem termina com um convite: "separo para você?", "prefere retirar ou receber em casa?".</span></span></label></li>
        <li><label><input type="checkbox" id="c6"><span><strong>Retoma quem parou de responder</strong><span class="hint">Uma mensagem educada no dia seguinte recupera venda que você daria como perdida.</span></span></label></li>
        <li><label><input type="checkbox" id="c7"><span><strong>Pós-venda depois da entrega</strong><span class="hint">Perguntar se o cliente gostou abre espaço para a próxima compra e para a indicação.</span></span></label></li>
      </ul>
      <p class="score" id="score" aria-live="polite">Sua equipe faz <b>0 de 7</b>.</p>

      <h2>Duas mensagens prontas para usar hoje</h2>
      <div class="script-box"><span class="lbl">Primeira resposta</span><p>"Oi, [nome]! Que bom que você chamou. Me conta: você está procurando para você ou para presente?"</p></div>
      <div class="script-box"><span class="lbl">Retomada no dia seguinte</span><p>"Oi, [nome]! Ontem você me perguntou sobre [produto]. Ainda tenho no seu tamanho. Quer que eu separe para você?"</p></div>

      <div class="quote">A venda não acontece quando você quer. <span>Ela acontece quando você permanece.</span></div>

      <h2>No seu negócio, isso vira...</h2>
      <p>Imprima esse checklist, ou mande este link para quem cuida do seu WhatsApp. Por uma semana, peça para a equipe marcar o que fez em cada atendimento. Você vai enxergar exatamente onde as vendas estão escapando.</p>
      <p>O anúncio traz o cliente. <strong>Quem fecha a venda é o atendimento.</strong></p>
    `
  }
];

const IG = "https://www.instagram.com/omarcocaetano/";
const WPP = "https://wa.me/556391114789";
const wppLink = p => WPP + "?text=" + encodeURIComponent(p.wppMsg || ("Oi, Marco! Li o material \"" + p.titulo + "\" e quero conversar sobre o meu negócio."));

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e2) { return false; }
  }
}
function wireCopy() {
  document.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const el = document.getElementById(btn.dataset.copy);
      const ok = await copyText(el.innerText.trim());
      btn.textContent = ok ? "Copiado" : "Selecione e copie";
      btn.classList.toggle("ok", ok);
      setTimeout(() => { btn.textContent = "Copiar"; btn.classList.remove("ok"); }, 2200);
    });
  });
}
const app = document.getElementById("app");

function fmtData(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}

function renderHome() {
  document.title = "Materiais do Marco";
  app.innerHTML = `
    <section class="hero">
      <h1>Estratégias de marketing <em>para você aplicar</em> no seu negócio</h1>
      <p>Aqui ficam os materiais completos dos meus vídeos: checklists, mensagens prontas e o passo a passo para colocar em prática.</p>
    </section>
    <p class="list-label">Materiais publicados</p>
    <div class="posts">
      ${POSTS.map(p => `
        <a class="post-card" href="${p.href || "#" + p.slug}">
          <span class="meta"><span class="chip">${p.pilar}</span><span>${fmtData(p.data)}</span></span>
          <h2>${p.titulo}</h2>
          <p>${p.resumo}</p>
        </a>`).join("")}
    </div>`;
  window.scrollTo(0, 0);
}

function renderPost(p) {
  document.title = p.titulo + " · Marco Antonio";
  app.innerHTML = `
    <a class="back" href="#inicio">← Todos os materiais</a>
    <article>
      <span class="meta"><span class="chip">${p.pilar}</span><span class="chip soft">Palavra-chave: ${p.palavra}</span><span>${fmtData(p.data)}</span></span>
      <h1>${p.titulo}</h1>
      ${p.apoio ? `<p class="lead">${p.apoio}</p>` : ""}
      <p class="byline"><span class="brand-badge" aria-hidden="true"><img src="foto.jpg" alt=""></span><span><b>Marco Antonio</b> · <a href="${IG}" target="_blank" rel="noopener">@omarcocaetano</a></span></p>
      ${p.corpo}
      <div class="cta">
        <h3>${p.ctaTitulo || "Quer isso funcionando no seu negócio?"}</h3>
        <p>${p.ctaTexto || "Eu ajudo negócios locais a juntar anúncio certo, perfil que passa confiança e atendimento que vende."} Me chama no WhatsApp: (63) 9111-4789.</p>
        <div class="btn-row">
          <a class="btn" href="${wppLink(p)}" target="_blank" rel="noopener">Falar com o Marco no WhatsApp</a>
          <button class="btn ghost" type="button" id="copy">Copiar link deste material</button>
        </div>
      </div>
    </article>`;
  wireChecklist();
  wireCalc();
  wireCusto();
  wireCopy();
  const btn = document.getElementById("copy");
  btn.addEventListener("click", async () => {
    btn.textContent = (await copyText(location.href)) ? "Link copiado" : "Copie o link na barra do navegador";
  });
  window.scrollTo(0, 0);
}

function wireChecklist() {
  const box = document.getElementById("chk");
  if (!box) return;
  const inputs = [...box.querySelectorAll("input")];
  const score = document.getElementById("score");
  const update = () => {
    const n = inputs.filter(i => i.checked).length;
    score.innerHTML = `Sua equipe faz <b>${n} de ${inputs.length}</b>.` + (n === inputs.length ? " Atendimento redondo." : "");
  };
  inputs.forEach(i => i.addEventListener("change", update));
  update();
}

/* Calculadora: quanto vender a mais para manter o mesmo lucro com desconto */
function brl(v) { return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function extraNeeded(preco, custo, desc) {
  const lucro = preco - custo;
  const lucroDesc = preco * (1 - desc / 100) - custo;
  if (lucro <= 0) return { erro: "O custo está maior ou igual ao preço. Confira os números." };
  if (lucroDesc <= 0) return { erro: `Com ${desc}% de desconto você vende no prejuízo: cada venda dá ${brl(lucroDesc)}.` };
  return { lucro, lucroDesc, extra: (lucro / lucroDesc - 1) * 100 };
}
function wireCalc() {
  const out = document.getElementById("calc-out");
  if (!out) return;
  const ids = ["cp", "cc", "cd"].map(id => document.getElementById(id));
  const update = () => {
    const [p, c, d] = ids.map(i => parseFloat(String(i.value).replace(",", ".")) || 0);
    const r = extraNeeded(p, c, d);
    out.innerHTML = r.erro ? r.erro :
      `Hoje você lucra <b>${brl(r.lucro)}</b> por venda. Com ${d}% de desconto, passa a lucrar <b>${brl(r.lucroDesc)}</b>. ` +
      `Para ter o mesmo lucro, precisa vender <span class="mark"><b>${Math.round(r.extra)}% a mais</b></span>.`;
  };
  ids.forEach(i => i.addEventListener("input", update));
  update();
}

/* Calculadora: quanto custa cada cliente (post #cliente) */
function wireCusto() {
  const out = document.getElementById("kc-out");
  if (!out) return;
  const ids = ["kc-inv", "kc-msg", "kc-vend", "kc-tic"].map(id => document.getElementById(id));
  const update = () => {
    const [inv, msg, vend, tic] = ids.map(i => parseFloat(String(i.value).replace(",", ".")) || 0);
    if (inv <= 0 || msg <= 0) { out.innerHTML = "Preencha o investimento e as conversas do mês."; return; }
    const porMsg = inv / msg;
    if (vend <= 0) { out.innerHTML = `Cada conversa te custa <b>${brl(porMsg)}</b>, mas nenhuma virou venda. O problema está no atendimento.`; return; }
    if (vend > msg) { out.innerHTML = "As vendas estão maiores que as conversas. Confira os números."; return; }
    const cliente = inv / vend, taxa = vend / msg * 100;
    const melhor = Math.min(msg, Math.ceil(vend * 1.5));
    let txt = `Cada conversa te custa <b>${brl(porMsg)}</b>. Você fecha <b>${taxa.toLocaleString("pt-BR", { maximumFractionDigits: 1 })}%</b> delas, ` +
      `então <span class="mark"><b>cada cliente sai por ${brl(cliente)}</b></span>.`;
    if (tic > 0) txt += ` Cada R$ 1 no anúncio volta <b>${brl(vend * tic / inv)}</b> em vendas.`;
    if (melhor > vend) txt += ` Se você fechar ${melhor} em vez de ${vend}, com o mesmo investimento, o cliente cai para <b>${brl(inv / melhor)}</b>.`;
    out.innerHTML = txt;
  };
  ids.forEach(i => i.addEventListener("input", update));
  update();
}

function route() {
  const slug = location.hash.replace("#", "");
  const post = POSTS.find(p => p.slug === slug && !p.href);
  post ? renderPost(post) : renderHome();
}
window.addEventListener("hashchange", route);
route();
</script>
